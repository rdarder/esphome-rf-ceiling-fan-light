# ceiling_fan_blueprint.yaml
substitutions:
  room_name: "default_fan"
  room_friendly_name: "Default Fan"
  radio_id: "0x0000"

esphome:
  includes:
    - ceiling_fan_hub.h
  on_boot:
    - priority: 800.0
      then:
        - lambda: |-
            auto *hub = new esphome::CeilingFanHub(${radio_id}, id(rf_transmitter));
            id(hub_${room_name}) = hub;
            hub->set_fan(id(fan_${room_name}));
            hub->setup();

globals:
  - id: hub_${room_name}
    type: esphome::Component*
    initial_value: 'nullptr'

interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (id(hub_${room_name}) != nullptr) {
            static_cast<esphome::CeilingFanHub*>(id(hub_${room_name}))->loop();
          }

output:
  - platform: template
    id: dummy_bright_${room_name}
    type: float
    write_action:
      lambda: ""
  - platform: template
    id: dummy_temp_${room_name}
    type: float
    write_action:
      lambda: ""

fan:
  - platform: template
    name: "${room_friendly_name} Fan"
    id: fan_${room_name}
    speed_count: 6
    has_direction: true
    on_speed_set:
      lambda: |-
        auto *hub = static_cast<esphome::CeilingFanHub*>(id(hub_${room_name}));
        if (hub != nullptr) {
          hub->control_fan_speed(x);
        }
    on_direction_set:
      lambda: |-
        auto *hub = static_cast<esphome::CeilingFanHub*>(id(hub_${room_name}));
        if (hub != nullptr) {
          hub->control_fan_direction(x);
        }
    on_turn_on:
      lambda: |-
        auto *hub = static_cast<esphome::CeilingFanHub*>(id(hub_${room_name}));
        if (hub != nullptr) {
          hub->control_fan_state(true);
        }
    on_turn_off:
      lambda: |-
        auto *hub = static_cast<esphome::CeilingFanHub*>(id(hub_${room_name}));
        if (hub != nullptr) {
          hub->control_fan_state(false);
        }

light:
  - platform: color_temperature
    name: "${room_friendly_name} Light"
    id: light_${room_name}
    default_transition_length: 0s
    color_temperature: dummy_temp_${room_name}
    brightness: dummy_bright_${room_name}
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 3000 K
    on_state:
      lambda: |-
        if (id(hub_${room_name}) != nullptr) {
          static_cast<esphome::CeilingFanHub*>(id(hub_${room_name}))->control_light(id(light_${room_name}));
        }
