# living-room-fans.yaml
esphome:
  name: fan-controller

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: DEBUG 

api:

ota:
  platform: esphome

wifi:
  ssid: darder
  password: "0142815800"
  ap:
    ssid: "Fan Controller Fallback"

captive_portal:

remote_transmitter:
  id: rf_transmitter
  pin: GPIO10
  carrier_duty_percent: 100%
  non_blocking: true

packages:
  living_fan:
    !include
    file: ceiling_fan_blueprint.yaml
    vars:
      room_name: "living_room"
      room_friendly_name: "Living Room"
      radio_id: "0x36A72"
  comedor_fan:
    !include
    file: ceiling_fan_blueprint.yaml
    vars:
      room_name: "comedor"
      room_friendly_name: "Comedor"
      radio_id: "0xC6C92"
